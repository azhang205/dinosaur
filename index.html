<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Dash</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: monospace;
}

#game {
    position: relative;
    width: 960px;
    height: 540px;
    max-width: 100vw;
    max-height: 100vh;
    overflow: hidden;
    background: #75c9ed;
}

canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
}

#hud {
    position: absolute;
    top: 15px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    color: white;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 3px 3px #263238;
    pointer-events: none;
    z-index: 3;
}

#message {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    background: rgba(10, 15, 20, .82);
    text-align: center;
    z-index: 10;
}

#message h1 {
    font-size: 55px;
    color: #fff36b;
    text-shadow: 5px 5px #493c30;
    margin-bottom: 15px;
}

#message p {
    font-size: 18px;
    line-height: 1.8;
    max-width: 700px;
}

button {
    margin-top: 20px;
    padding: 12px 30px;
    font-family: monospace;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    background: #e65b45;
    border: 4px solid #542d29;
    cursor: pointer;
}

button:hover {
    background: #f47b5f;
}

#cutscene {
    position: absolute;
    inset: 0;
    background: #050505;
    z-index: 20;
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

#cutsceneText {
    font-size: 28px;
    line-height: 1.8;
    max-width: 750px;
    min-height: 150px;
}

#skip {
    position: absolute;
    bottom: 25px;
    right: 25px;
    font-size: 14px;
    background: #333;
    border-color: #777;
}
#levelIntro {
    position: absolute;
    inset: 0;
    background: #000;
    color: white;
    z-index: 15;

    display: none;
    align-items: center;
    justify-content: center;

    font-family: monospace;
}

#levelIntroText {
    font-size: 64px;
    font-weight: bold;
    letter-spacing: 5px;
    text-shadow: 5px 5px #333;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas" width="960" height="540"></canvas>
<div id="levelIntro">
    <div id="levelIntroText">LEVEL 1</div>
</div>

<div id="hud">
    <span>❤️ <span id="lives">3</span></span>
    <span>🦴 <span id="bones">0</span></span>
    <span>⭐ <span id="score">0</span></span>
    <span>WORLD <span id="world">1-1</span></span>
</div>

<div id="message">

    <h1>DINO DASH</h1>

    <p>
        ← → / A D &nbsp; MOVE<br>
        SPACE / W / ↑ &nbsp; JUMP<br><br>
        Stomp enemies to make them drop bones.<br>
        Collect the bones and reach the flag!
    </p>

    <button id="start">START GAME</button>

</div>

<div id="cutscene">

    <div id="cutsceneText"></div>

    <button id="skip">SKIP</button>

</div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

ctx.imageSmoothingEnabled = false;


/* =========================================================
   GAME STATE
========================================================= */

let running = false;
let gameOver = false;

let level = 1;

let cameraX = 0;

let score = 0;
let bones = 0;
let lives = 3;

let keys = {};

let levelWidth = 7000;

let lavaLevel = null;

let lastTime = 0;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: 120,
    y: 300,

    width: 42,
    height: 52,

    vx: 0,
    vy: 0,

    speed: 4.5,
    jump: -12,

    grounded: false,

    facing: 1,

    invincible: 0,

    anim: 0
};


/* =========================================================
   LEVEL DATA
========================================================= */

let platforms = [];
let enemies = [];
let collectibles = [];
let droppedBones = [];
let particles = [];
let lavaPools = [];

let flag = {
    x: 6700,
    y: 270
};


/* =========================================================
   INPUT
========================================================= */

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (
        e.key === " " ||
        e.key === "ArrowUp" ||
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight"
    ) {
        e.preventDefault();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});


/* =========================================================
   BASIC HELPERS
========================================================= */

function collision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


function addPlatform(x, y, width, height) {

    platforms.push({
        x,
        y,
        width,
        height
    });
}


function addEnemy(x, home, type = "normal") {

    enemies.push({

        x,

        y: 420,

        width: type === "big" ? 52 : 40,
        height: type === "big" ? 50 : 40,

        vx: type === "fast" ? 1.8 : 1.2,

        left: home - 120,
        right: home + 120,

        alive: true,

        type,

        anim: Math.random() * 10
    });
}


function addBone(x, y) {

    collectibles.push({

        x,
        y,

        collected: false,

        bob: Math.random() * Math.PI * 2,

        spin: Math.random() * Math.PI * 2
    });
}


function addLava(x, width) {

    lavaPools.push({
        x,
        width
    });
}


/* =========================================================
   CREATE LEVEL
========================================================= */

function createLevel(number) {

    platforms = [];
    enemies = [];
    collectibles = [];
    droppedBones = [];
    particles = [];
    lavaPools = [];

    cameraX = 0;

    lavaLevel = null;

    flag = {
        x: 6700,
        y: 270
    };


    /*
        LEVEL 1
        Grasslands
    */

    if (number === 1) {

        levelWidth = 7000;

        addPlatform(0, 460, 900, 80);
        addPlatform(1000, 460, 900, 80);
        addPlatform(2000, 460, 1000, 80);
        addPlatform(3100, 460, 900, 80);
        addPlatform(4100, 460, 1000, 80);
        addPlatform(5200, 460, 1800, 80);

        addPlatform(500, 350, 160, 25);
        addPlatform(720, 290, 130, 25);

        addPlatform(1150, 350, 150, 25);
        addPlatform(1450, 280, 140, 25);

        addPlatform(2150, 350, 170, 25);
        addPlatform(2450, 290, 140, 25);

        addPlatform(3250, 350, 160, 25);
        addPlatform(3500, 280, 140, 25);

        addPlatform(4300, 350, 170, 25);
        addPlatform(4600, 280, 140, 25);

        addPlatform(5400, 350, 160, 25);
        addPlatform(5750, 280, 140, 25);
        addPlatform(6200, 340, 160, 25);

        addEnemy(650, 650);
        addEnemy(1250, 1250);
        addEnemy(2250, 2250);
        addEnemy(3350, 3350);
        addEnemy(4450, 4450);
        addEnemy(5550, 5550);

        const bones = [
            [350, 410],
            [550, 315],
            [770, 255],
            [1150, 315],
            [1450, 245],
            [2150, 315],
            [2500, 255],
            [3300, 315],
            [3550, 245],
            [4350, 315],
            [4650, 245],
            [5450, 315],
            [5800, 245],
            [6250, 305]
        ];

        bones.forEach(b => addBone(b[0], b[1]));
    }


    /*
        LEVEL 2
        Lava Valley
    */

    if (number === 2) {

    levelWidth = 7600;

    // Ground
    addPlatform(0, 460, 700, 80);
    addPlatform(800, 460, 550, 80);
    addPlatform(1450, 460, 700, 80);
    addPlatform(2250, 460, 550, 80);
    addPlatform(2900, 460, 1000, 80);
    addPlatform(4000, 460, 500, 80);
    addPlatform(4600, 460, 700, 80);
    addPlatform(5400, 460, 2200, 80);

    // Lava — all 100 pixels wide
    addLava(700, 100);
    addLava(1350, 100);
    addLava(2150, 100);
    addLava(2800, 100);
    addLava(3900, 100);
    addLava(4500, 100);
    addLava(5300, 100);

    // Floating platforms
    addPlatform(500, 350, 120, 25);
    addPlatform(750, 300, 100, 25);
    addPlatform(1100, 330, 120, 25);

    addPlatform(1600, 350, 150, 25);
    addPlatform(1900, 280, 120, 25);

    addPlatform(2350, 350, 130, 25);
    addPlatform(2600, 280, 120, 25);

    addPlatform(3150, 340, 150, 25);
    addPlatform(3450, 280, 130, 25);

    addPlatform(4150, 350, 130, 25);
    addPlatform(4800, 340, 150, 25);

    // ENEMIES
    addEnemy(450, 450);
    addEnemy(1100, 1100, "fast");
    addEnemy(1750, 1750);
    addEnemy(2500, 2500, "fast");
    addEnemy(3300, 3300);
    addEnemy(4200, 4200, "fast");
    addEnemy(4900, 4900);
    addEnemy(5900, 5900);

    // Bones
    [
        [350,410],
        [550,315],
        [1120,295],
        [1650,315],
        [1930,245],
        [2400,315],
        [2650,245],
        [3200,305],
        [3500,245],
        [4200,315],
        [4850,305],
        [5600,410],
        [6000,410],
        [6500,410]
    ].forEach(b => addBone(b[0], b[1]));
}


    /*
        LEVEL 3
        Jungle
    */

    if (number === 3) {

        levelWidth = 8000;

        addPlatform(0, 460, 1200, 80);
        addPlatform(1300, 460, 1000, 80);
        addPlatform(2400, 460, 1200, 80);
        addPlatform(3700, 460, 800, 80);
        addPlatform(4600, 460, 1300, 80);
        addPlatform(6000, 460, 2000, 80);

        addLava(1200, 100);
        addLava(2300, 100);
        addLava(3600, 100);
        addLava(4500, 100);
        addLava(5900, 100);

        for (let i = 0; i < 12; i++) {

            addPlatform(
                400 + i * 550,
                300 - (i % 2) * 70,
                130,
                25
            );
        }

        addEnemy(700, 700);
        addEnemy(1500, 1500, "fast");
        addEnemy(1900, 1900);
        addEnemy(2700, 2700, "big");
        addEnemy(3150, 3150);
        addEnemy(3950, 3950, "fast");
        addEnemy(4800, 4800);
        addEnemy(5300, 5300, "big");
        addEnemy(6200, 6200, "fast");
        addEnemy(6900, 6900);
        addEnemy(7400, 7400, "big");

        for (let x = 300; x < 7600; x += 350) {

            addBone(
                x,
                400 - Math.sin(x) * 80
            );
        }
    }


    /*
        LEVEL 4
        Mountain
    */

    if (number === 4) {

        levelWidth = 8500;

        addPlatform(0, 460, 900, 80);
        addPlatform(1050, 460, 800, 80);
        addPlatform(2000, 460, 650, 80);
        addPlatform(2800, 460, 1000, 80);
        addPlatform(3950, 460, 700, 80);
        addPlatform(4800, 460, 800, 80);
        addPlatform(5750, 460, 900, 80);
        addPlatform(6800, 460, 1700, 80);

        addLava(900, 150);
        addLava(1850, 150);
        addLava(2650, 150);
        addLava(3800, 150);
        addLava(4650, 150);
        addLava(5600, 150);
        addLava(6650, 150);

        addPlatform(400, 340, 140, 25);
        addPlatform(650, 250, 130, 25);

        addPlatform(1200, 350, 140, 25);
        addPlatform(1500, 260, 130, 25);

        addPlatform(2150, 350, 140, 25);
        addPlatform(2400, 260, 130, 25);

        addPlatform(3000, 340, 140, 25);
        addPlatform(3300, 250, 130, 25);

        addPlatform(4100, 340, 140, 25);
        addPlatform(4400, 260, 130, 25);

        addPlatform(4950, 350, 140, 25);
        addPlatform(5250, 260, 130, 25);

        addEnemy(500, 500);
        addEnemy(1300, 1300, "fast");
        addEnemy(2200, 2200, "big");
        addEnemy(3100, 3100);
        addEnemy(4200, 4200, "fast");
        addEnemy(5000, 5000, "big");
        addEnemy(6000, 6000, "fast");
        addEnemy(7200, 7200, "big");
        addEnemy(7900, 7900);

        for (let x = 300; x < 8000; x += 420) {
            addBone(x, 410);
        }
    }


    /*
        LEVEL 5
        VOLCANO ESCAPE
    */

    if (number === 5) {

        levelWidth = 10000;

        lavaLevel = 530;

        addPlatform(0, 460, 1000, 80);
        addPlatform(1100, 460, 800, 80);
        addPlatform(2000, 460, 900, 80);
        addPlatform(3000, 460, 900, 80);
        addPlatform(4000, 460, 900, 80);
        addPlatform(5000, 460, 1000, 80);
        addPlatform(6100, 460, 900, 80);
        addPlatform(7100, 460, 2900, 80);

        addLava(1000, 100);
        addLava(1900, 100);
        addLava(2900, 100);
        addLava(3900, 100);
        addLava(4900, 100);
        addLava(6000, 100);
        addLava(7000, 100);

        addPlatform(500, 350, 150, 25);
        addPlatform(800, 280, 130, 25);

        addPlatform(1250, 350, 150, 25);
        addPlatform(1550, 280, 130, 25);

        addPlatform(2150, 350, 150, 25);
        addPlatform(2450, 270, 130, 25);

        addPlatform(3150, 350, 150, 25);
        addPlatform(3500, 270, 130, 25);

        addPlatform(4150, 350, 150, 25);
        addPlatform(4500, 270, 130, 25);

        addPlatform(5150, 350, 150, 25);
        addPlatform(5500, 270, 130, 25);

        addPlatform(6250, 350, 150, 25);
        addPlatform(6600, 270, 130, 25);

        addEnemy(600, 600, "fast");
        addEnemy(1350, 1350);
        addEnemy(2250, 2250, "fast");
        addEnemy(3200, 3200);
        addEnemy(4250, 4250, "big");
        addEnemy(5200, 5200, "fast");
        addEnemy(6350, 6350);
        addEnemy(7500, 7500, "big");
        addEnemy(8300, 8300, "fast");
        addEnemy(9000, 9000, "big");

        for (let x = 300; x < 9500; x += 380) {

            addBone(
                x,
                400 - ((x / 380) % 2) * 80
            );
        }
    }
}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer() {

    let moving = false;

    if (keys["arrowleft"] || keys["a"]) {

        player.vx = -player.speed;
        player.facing = -1;

        moving = true;

    } else if (keys["arrowright"] || keys["d"]) {

        player.vx = player.speed;
        player.facing = 1;

        moving = true;

    } else {

        player.vx *= 0.75;
    }


    if (
        (keys[" "] ||
        keys["arrowup"] ||
        keys["w"]) &&
        player.grounded
    ) {

        player.vy = player.jump;
        player.grounded = false;
    }


    player.vy += 0.55;

    player.x += player.vx;
    player.y += player.vy;

    player.grounded = false;


    for (const p of platforms) {

        if (
            player.x + player.width > p.x &&
            player.x < p.x + p.width &&
            player.y + player.height >= p.y &&
            player.y + player.height <= p.y + 20 &&
            player.vy >= 0
        ) {

            player.y =
                p.y - player.height;

            player.vy = 0;

            player.grounded = true;
        }
    }


    if (player.x < 0) {
        player.x = 0;
    }


    // Regular lava

    for (const lava of lavaPools) {

        if (
    player.x + player.width > lava.x &&
    player.x < lava.x + lava.width &&
    player.y + player.height > 450
) {
    loseLife();
}
    }


    // Volcano lava

    if (
        lavaLevel !== null &&
        player.y + player.height > lavaLevel
    ) {

        loseLife();
    }


    if (player.y > HEIGHT + 100) {

        loseLife();
    }


    if (player.invincible > 0) {
        player.invincible--;
    }


    if (moving) {
        player.anim += 0.25;
    }
}


/* =========================================================
   ENEMIES
========================================================= */

function updateEnemies() {

    for (const enemy of enemies) {

        if (!enemy.alive) continue;

        enemy.x += enemy.vx;

        if (
            enemy.x < enemy.left ||
            enemy.x > enemy.right
        ) {

            enemy.vx *= -1;
        }

        enemy.anim += 0.15;


        if (
            player.invincible <= 0 &&
            collision(player, enemy)
        ) {

            /*
                STOMP
            */

            if (
                player.vy > 0 &&
                player.y + player.height - 12 <
                enemy.y + 18
            ) {

                enemy.alive = false;

                player.vy = -8;

                score += 250;

                /*
                    THIS IS THE IMPORTANT PART:
                    The enemy visibly drops a bone.
                */

                droppedBones.push({

                    x: enemy.x + enemy.width / 2,

                    y: enemy.y - 5,

                    vx:
                        (Math.random() - .5) * 3,

                    vy: -8,

                    rotation: 0,

                    spin:
                        (Math.random() - .5) * .25,

                    life: 600,

                    collectible: false
                });


                spawnParticles(
                    enemy.x + 20,
                    enemy.y + 20,
                    18
                );

            } else {

                loseLife();
            }
        }
    }
}


/* =========================================================
   DROPPED BONE PHYSICS
========================================================= */

function updateDroppedBones() {

    for (
        let i = droppedBones.length - 1;
        i >= 0;
        i--
    ) {

        const bone = droppedBones[i];

        bone.vy += 0.35;

        bone.x += bone.vx;
        bone.y += bone.vy;

        bone.rotation += bone.spin;

        bone.life--;


        /*
            Let the dropped bone bounce
        */

        if (bone.y > 425) {

            bone.y = 425;

            bone.vy *= -0.55;

            bone.vx *= 0.92;

            bone.spin *= 0.9;
        }


        /*
            Player collects it
        */

        const hitbox = {

            x: bone.x - 14,
            y: bone.y - 14,

            width: 28,
            height: 28
        };


        if (collision(player, hitbox)) {

            score += 150;
            bones++;

            spawnParticles(
                bone.x,
                bone.y,
                14
            );

            droppedBones.splice(i, 1);

            continue;
        }


        if (bone.life <= 0) {

            droppedBones.splice(i, 1);
        }
    }
}


/* =========================================================
   COLLECTIBLES
========================================================= */

function updateCollectibles() {

    for (const bone of collectibles) {

        if (bone.collected) continue;

        bone.bob += 0.08;
        bone.spin += 0.04;

        const hitbox = {

            x: bone.x - 14,
            y: bone.y - 14,

            width: 28,
            height: 28
        };


        if (collision(player, hitbox)) {

            bone.collected = true;

            bones++;

            score += 100;

            spawnParticles(
                bone.x,
                bone.y,
                10
            );
        }
    }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    const target =
        player.x - WIDTH * 0.35;

    cameraX +=
        (target - cameraX) * 0.08;

    cameraX =
        Math.max(
            0,
            Math.min(
                cameraX,
                levelWidth - WIDTH
            )
        );
}


/* =========================================================
   LIVES
========================================================= */

function loseLife() {

    if (player.invincible > 0) {
        return;
    }

    lives--;

    updateHUD();


    if (lives <= 0) {

        running = false;

        showMessage(
            "GAME OVER",
            "Score: " +
            score +
            "<br>Bones: " +
            bones +
            "<br>Reached World " +
            level,
            "TRY AGAIN"
        );

        return;
    }


    player.x =
        Math.max(
            100,
            player.x - 300
        );

    player.y = 300;

    player.vx = 0;
    player.vy = 0;

    player.invincible = 120;
}


/* =========================================================
   FLAG
========================================================= */

function checkFlag() {

    const goal = {

        x: flag.x,
        y: flag.y,

        width: 55,
        height: 190
    };


    if (collision(player, goal)) {

        if (level === 4) {

            running = false;

            startVolcanoCutscene();

        } else if (level < 5) {

            level++;

            startLevel();

        } else {

            running = false;

            showMessage(
                "YOU ESCAPED!",
                "You survived the volcano!<br><br>" +
                "Final Score: " +
                score +
                "<br>Total Bones: " +
                bones,
                "PLAY AGAIN"
            );
        }
    }
}


/* =========================================================
   VOLCANO
========================================================= */

function updateVolcano() {

    if (level !== 5 || lavaLevel === null) {
        return;
    }


    /*
        The lava slowly rises.
    */

    lavaLevel -= 0.025;


    /*
        The farther the player gets,
        the faster the volcano becomes.
    */

    if (player.x > 4000) {
        lavaLevel -= 0.018;
    }

    if (player.x > 6500) {
        lavaLevel -= 0.025;
    }


    // Lava particles

    if (Math.random() < 0.25) {

        particles.push({

            x:
                cameraX +
                Math.random() * WIDTH,

            y:
                lavaLevel,

            vx:
                Math.random() * 2 - 1,

            vy:
                -Math.random() * 4,

            life: 40,

            size:
                3 + Math.random() * 5
        });
    }
}


/* =========================================================
   PARTICLES
========================================================= */

function spawnParticles(x, y, amount) {

    for (let i = 0; i < amount; i++) {

        particles.push({

            x,
            y,

            vx:
                Math.random() * 6 - 3,

            vy:
                Math.random() * -6 - 1,

            life:
                30 +
                Math.random() * 30,

            size:
                3 +
                Math.random() * 5
        });
    }
}


function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vy += 0.2;

        p.life--;

        if (p.life <= 0) {

            particles.splice(i, 1);
        }
    }
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    let skyColor = "#75c9ed";


    if (level === 2) {
        skyColor = "#ef9b61";
    }

    if (level === 3) {
        skyColor = "#58b98c";
    }

    if (level === 4) {
        skyColor = "#8b9ba5";
    }

    if (level === 5) {
        skyColor = "#3d2024";
    }


    ctx.fillStyle = skyColor;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
        Sun
    */

    if (level < 5) {

        ctx.fillStyle =
            level === 4
            ? "#ffe5a0"
            : "#fff18a";

        ctx.beginPath();

        ctx.arc(
            770,
            90,
            45,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /*
        Mountains
    */

    ctx.fillStyle =
        level === 5
        ? "#26181b"
        : level === 4
        ? "#59676e"
        : "#77a9a0";


    for (
        let x = -500;
        x < levelWidth;
        x += 500
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x - cameraX * .15,
            390
        );

        ctx.lineTo(
            x + 250 - cameraX * .15,
            level === 4 ? 130 : 180
        );

        ctx.lineTo(
            x + 500 - cameraX * .15,
            390
        );

        ctx.fill();
    }


    /*
        Volcano in background
    */

    if (level === 5) {

        const volcanoX =
            700 - cameraX * .12;

        ctx.fillStyle = "#171215";

        ctx.beginPath();

        ctx.moveTo(volcanoX - 300, 390);

        ctx.lineTo(volcanoX, 80);

        ctx.lineTo(volcanoX + 300, 390);

        ctx.fill();


        // Lava on volcano

        ctx.strokeStyle = "#ff5a2a";
        ctx.lineWidth = 8;

        ctx.beginPath();

        ctx.moveTo(volcanoX, 100);
        ctx.lineTo(volcanoX - 30, 220);
        ctx.lineTo(volcanoX - 10, 310);

        ctx.stroke();
    }


    /*
        Clouds
    */

    if (level !== 5) {

        ctx.fillStyle =
            "rgba(255,255,255,.7)";

        for (let i = 0; i < 12; i++) {

            let x =
                i * 700 -
                (cameraX * .25 % 700);

            let y =
                70 +
                (i % 3) * 55;

            ctx.fillRect(
                x,
                y,
                100,
                20
            );

            ctx.fillRect(
                x + 25,
                y - 15,
                50,
                35
            );
        }
    }
}


/* =========================================================
   PLATFORM
========================================================= */

function drawPlatform(p) {

    const x =
        p.x - cameraX;


    if (
        x + p.width < 0 ||
        x > WIDTH
    ) {
        return;
    }


    ctx.fillStyle =
        level === 5
        ? "#3d3430"
        : level === 4
        ? "#5a4b40"
        : "#8b542f";


    ctx.fillRect(
        x,
        p.y,
        p.width,
        p.height
    );


    ctx.fillStyle =
        level === 5
        ? "#5b3028"
        : "#4e9b45";


    ctx.fillRect(
        x,
        p.y,
        p.width,
        12
    );


    ctx.fillStyle =
        level === 5
        ? "#d64b25"
        : "#79c34d";


    for (
        let i = 0;
        i < p.width;
        i += 20
    ) {

        ctx.fillRect(
            x + i,
            p.y,
            10,
            5
        );
    }
}


/* =========================================================
   LAVA
========================================================= */

function drawLava() {

    /*
        Normal lava pits
    */

    for (const lava of lavaPools) {

        const x =
            lava.x - cameraX;


        ctx.fillStyle = "#ff4b16";

        ctx.fillRect(
            x,
            455,
            lava.width - 6,
            85
        );


        ctx.fillStyle = "#ffb300";

        for (
            let i = 0;
            i < lava.width - 6;
            i += 35
        ) {

            const wave =
                Math.sin(
                    performance.now() * .005 +
                    i
                ) * 5;

            ctx.fillRect(
                x + i,
                455 + wave,
                25,
                8
            );
        }
    }


    /*
        Final volcano lava
    */

    if (
        level === 5 &&
        lavaLevel !== null
    ) {

        ctx.fillStyle = "#ff3b0a";

        ctx.fillRect(
            0,
            lavaLevel,
            WIDTH,
            HEIGHT - lavaLevel
        );


        ctx.fillStyle = "#ff9d00";

        for (
            let x = 0;
            x < WIDTH;
            x += 35
        ) {

            const wave =
                Math.sin(
                    performance.now() * .006 +
                    x
                ) * 7;

            ctx.fillRect(
                x,
                lavaLevel + wave,
                25,
                9
            );
        }
    }
}


/* =========================================================
   BONE DRAWING
========================================================= */

function drawBoneShape(
    x,
    y,
    rotation,
    scale = 1
) {

    ctx.save();

    ctx.translate(x, y);

    ctx.rotate(rotation);

    ctx.scale(scale, scale);


    ctx.fillStyle = "#fff0a8";


    /*
        Much more recognizable bone shape.
    */

    ctx.fillRect(
        -4,
        -18,
        8,
        36
    );


    ctx.fillRect(
        -11,
        -18,
        9,
        8
    );

    ctx.fillRect(
        2,
        -18,
        9,
        8
    );


    ctx.fillRect(
        -11,
        10,
        9,
        8
    );

    ctx.fillRect(
        2,
        10,
        9,
        8
    );


    /*
        Highlight
    */

    ctx.fillStyle = "#fffbd8";

    ctx.fillRect(
        -2,
        -15,
        3,
        25
    );


    ctx.restore();
}


function drawBone(bone) {

    if (bone.collected) {
        return;
    }


    const x =
        bone.x - cameraX;

    const y =
        bone.y +
        Math.sin(bone.bob) * 6;


    drawBoneShape(
        x,
        y,
        Math.sin(bone.spin) * .2,
        0.75
    );
}


/* =========================================================
   DROPPED BONES
========================================================= */

function drawDroppedBones() {

    for (const bone of droppedBones) {

        const x =
            bone.x - cameraX;


        /*
            Glow makes the dropped bone
            extremely obvious.
        */

        ctx.save();

        ctx.globalAlpha =
            0.25 +
            Math.sin(
                performance.now() * .01
            ) * .1;

        ctx.fillStyle = "#fff36b";

        ctx.beginPath();

        ctx.arc(
            x,
            bone.y,
            25,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();


        drawBoneShape(
            x,
            bone.y,
            bone.rotation,
            0.9
        );
    }
}


/* =========================================================
   ENEMY
========================================================= */

function drawEnemy(enemy) {

    if (!enemy.alive) {
        return;
    }


    const x =
        enemy.x - cameraX;


    ctx.save();

    ctx.translate(
        x + enemy.width / 2,
        enemy.y + enemy.height / 2
    );


    const big =
        enemy.type === "big";


    ctx.fillStyle =
        enemy.type === "fast"
        ? "#bd55a5"
        : enemy.type === "big"
        ? "#7c5ac7"
        : "#b94e43";


    ctx.fillRect(
        -18,
        -10,
        big ? 40 : 30,
        25
    );


    ctx.fillRect(
        5,
        -20,
        big ? 25 : 20,
        20
    );


    ctx.fillRect(
        -28,
        -5,
        12,
        10
    );


    ctx.fillStyle = "#fff";

    ctx.fillRect(
        17,
        -16,
        6,
        6
    );


    ctx.fillStyle = "#111";

    ctx.fillRect(
        19,
        -16,
        4,
        6
    );


    ctx.fillStyle =
        "#7f3834";


    ctx.fillRect(
        -12,
        13,
        8,
        10
    );


    ctx.fillRect(
        10,
        13,
        8,
        10
    );


    ctx.restore();
}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer() {

    if (
        player.invincible > 0 &&
        Math.floor(
            player.invincible / 5
        ) % 2 === 0
    ) {
        return;
    }


    const x =
        player.x - cameraX;

    const y =
        player.y;


    ctx.save();

    ctx.translate(
        x + player.width / 2,
        y + player.height / 2
    );


    if (player.facing < 0) {
        ctx.scale(-1, 1);
    }


    ctx.fillStyle = "#438d4b";

    // Tail

    ctx.fillRect(
        -27,
        2,
        20,
        12
    );

    ctx.fillRect(
        -35,
        -3,
        15,
        10
    );


    // Body

    ctx.fillStyle = "#55a957";

    ctx.fillRect(
        -15,
        -8,
        32,
        30
    );


    // Belly

    ctx.fillStyle = "#a6c96b";

    ctx.fillRect(
        -5,
        -2,
        18,
        25
    );


    // Neck

    ctx.fillStyle = "#55a957";

    ctx.fillRect(
        8,
        -25,
        15,
        25
    );


    // Head

    ctx.fillRect(
        12,
        -32,
        30,
        23
    );


    // Snout

    ctx.fillRect(
        32,
        -25,
        15,
        13
    );


    // Eye

    ctx.fillStyle = "#fff";

    ctx.fillRect(
        30,
        -27,
        7,
        7
    );

    ctx.fillStyle = "#111";

    ctx.fillRect(
        33,
        -27,
        4,
        7
    );


    // Arm

    ctx.fillStyle = "#438d4b";

    ctx.fillRect(
        16,
        -3,
        8,
        17
    );


    // Legs

    const leg =
        Math.sin(player.anim) * 5;

    ctx.fillRect(
        -9,
        17,
        10,
        18 + leg
    );

    ctx.fillRect(
        10,
        17,
        10,
        18 - leg
    );


    ctx.restore();
}


/* =========================================================
   FLAG
========================================================= */

function drawFlag() {

    const x =
        flag.x - cameraX;


    ctx.fillStyle = "#6b4631";

    ctx.fillRect(
        x,
        flag.y,
        8,
        190
    );


    ctx.fillStyle = "#e94e4e";

    ctx.beginPath();

    ctx.moveTo(
        x + 8,
        flag.y
    );

    ctx.lineTo(
        x + 70,
        flag.y + 25
    );

    ctx.lineTo(
        x + 8,
        flag.y + 50
    );

    ctx.fill();
}


/* =========================================================
   PARTICLES
========================================================= */

function drawParticles() {

    for (const p of particles) {

        ctx.fillStyle =
            level === 5
            ? "#ff7b19"
            : "#fff36b";


        ctx.fillRect(
            p.x - cameraX,
            p.y,
            p.size,
            p.size
        );
    }
}


/* =========================================================
   DRAW EVERYTHING
========================================================= */

function draw() {

    drawBackground();


    for (const p of platforms) {
        drawPlatform(p);
    }


    drawLava();


    drawFlag();


    for (const bone of collectibles) {
        drawBone(bone);
    }


    drawDroppedBones();


    for (const enemy of enemies) {
        drawEnemy(enemy);
    }


    drawParticles();

    drawPlayer();
}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    document.getElementById("lives")
        .textContent = lives;

    document.getElementById("bones")
        .textContent = bones;

    document.getElementById("score")
        .textContent = score;

    document.getElementById("world")
        .textContent = level + "-1";
}


/* =========================================================
   START LEVEL
========================================================= */

function startLevel() {

    createLevel(level);

    player.x = 120;
    player.y = 300;

    player.vx = 0;
    player.vy = 0;

    player.invincible = 0;

    // Pause the game during the level intro
    running = false;

    const intro =
        document.getElementById("levelIntro");

    const introText =
        document.getElementById("levelIntroText");

    introText.textContent =
        "LEVEL " + level;

    intro.style.display = "flex";

    updateHUD();

    setTimeout(function() {

        intro.style.display = "none";

        running = true;

    }, 1500);
}


/* =========================================================
   VOLCANO CUTSCENE
========================================================= */

let cutsceneTimer = null;

function startVolcanoCutscene() {

    const cutscene =
        document.getElementById("cutscene");

    const text =
        document.getElementById("cutsceneText");

    cutscene.style.display = "flex";

    const scenes = [

        "DINO:<br><br>Finally...<br>I made it out of the mountains.",

        "The ground begins to shake.",

        "BOOOOOOM!",

        "DINO:<br><br>Uh oh.",

        "A massive volcano erupts in the distance.",

        "DINO:<br><br>RUN!!!"
    ];


    let index = 0;


    function nextScene() {

        if (index >= scenes.length) {

            cutscene.style.display = "none";

            level = 5;

            startLevel();

            return;
        }


        text.innerHTML =
            scenes[index];

        index++;

        cutsceneTimer =
            setTimeout(
                nextScene,
                1700
            );
    }


    nextScene();
}


/* =========================================================
   CUTSCENE SKIP
========================================================= */

document.getElementById("skip")
    .addEventListener(
        "click",
        () => {

            clearTimeout(cutsceneTimer);

            document.getElementById(
                "cutscene"
            ).style.display = "none";

            level = 5;

            startLevel();
        }
    );


/* =========================================================
   MENU
========================================================= */

function showMessage(
    title,
    text,
    buttonText
) {

    const message =
        document.getElementById(
            "message"
        );


    message.querySelector("h1")
        .textContent = title;


    message.querySelector("p")
        .innerHTML = text;


    document.getElementById("start")
        .textContent = buttonText;


    message.style.display =
        "flex";
}


function startGame() {

    level = 1;

    score = 0;
    bones = 0;
    lives = 3;

    player.x = 120;
    player.y = 300;

    player.vx = 0;
    player.vy = 0;

    player.invincible = 0;

    gameOver = false;

    document.getElementById("message")
        .style.display = "none";

    startLevel();
}


document.getElementById("start")
    .addEventListener(
        "click",
        startGame
    );


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time) {

    const delta =
        Math.min(
            (time - lastTime) / 16.67,
            2
        );

    lastTime = time;


    if (running) {

        updatePlayer();

        updateEnemies();

        updateCollectibles();

        updateDroppedBones();

        updateParticles();

        updateVolcano();

        updateCamera();

        checkFlag();

        updateHUD();
    }


    draw();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   INIT
========================================================= */

createLevel(1);

updateHUD();

requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
